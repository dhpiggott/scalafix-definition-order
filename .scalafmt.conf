version = "3.11.5"
runner.dialect = scala213
# The test fixtures are the rule's exact input and expected output, so
# formatting them would change what they test.
project.excludePaths = [
  "glob:**/input/**"
  "glob:**/output/**"
]
fileOverride {
  "glob:**/project/**" {
    runner.dialect = sbt1
  }
  "glob:**/**.sbt" {
    runner.dialect = sbt1
  }
}
