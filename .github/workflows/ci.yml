name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR builds, but never a build of main: those are the runs
  # that save the dependency cache (setup-java's `cache: sbt`, below) that PR
  # runs restore from, since a cache saved on one PR is invisible to others.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Runs take under a minute, and the first, with nothing cached, would have
    # taken about the same had a download not stalled. Ten minutes leaves room
    # for a slow cold start but stops a hung job well before GitHub's default
    # of six hours.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # sbt-dynver derives `version` from the tag history, so a shallow
          # clone silently produces 0.0.0+….
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Check formatting and run the tests
        run: sbt --batch --no-colors scalafmtCheckAll scalafmtSbtCheck tests/test
