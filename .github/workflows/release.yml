name: Release

# A v* tag publishes that release to Maven Central. Dispatching the workflow on
# main publishes a snapshot instead: sbt-ci-release decides which from whether
# HEAD is tagged.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # The signing key and Central token live in this environment rather than
    # the repository, so that only refs its deployment rules allow (v* tags
    # and main) can read them.
    environment: release
    # Unmeasured until the first publish: on top of the build, sbt-ci-release
    # uploads the bundle and waits for Central to validate it, which can take
    # several minutes. Tighten this once real runs show how long that is.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # sbt-ci-release takes the version from the tag history, through
          # sbt-dynver. A shallow clone has no tags, so even a v* tag build
          # would compute a 0.0.0+… version rather than the tag's.
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Publish
        run: sbt --batch --no-colors ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
