# Lands the update bots' PRs once Build is green. Mergify merges as its own
# GitHub App rather than as GITHUB_TOKEN, so the push to main starts ci.yml and
# release.yml like any other merge does.
pull_request_rules:
  - name: Merge update bots' PRs once Build passes
    conditions:
      - base=main
      - or:
          - author=dependabot[bot]
          - author=scala-steward-dhpiggott[bot]
      - -draft
      - check-success=Build
    actions:
      merge:
        # Squash, so the commit on main is GitHub's own and signed, whatever
        # the bot's commits were.
        method: squash
  # Neither bot brings a PR up to date unless it conflicts. Rebase rather than
  # merge main in, because Scala Steward stops maintaining a PR that carries a
  # commit authored by anyone else.
  - name: Bring update bots' PRs up to date with main
    conditions:
      - base=main
      - or:
          - author=dependabot[bot]
          - author=scala-steward-dhpiggott[bot]
      - -draft
      - -conflict
      - "#commits-behind>0"
    actions:
      rebase: {}
